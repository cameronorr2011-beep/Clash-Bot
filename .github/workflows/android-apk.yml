name: build-apk

# Builds the sideloadable NeuroML/Clash-Bot APK from android/ and publishes it.
#   artifact: NeuroML-Android-APK (Actions run page)
#   release:  https://github.com/<owner>/Clash-Bot/releases/download/android/NeuroML-Android.apk
#
# NOTE: this workflow is the build path because the Chaquopy + torch toolchain
# (JDK + Android SDK 33 + Python 3.11) is heavy; the repo does not ship a local
# Android SDK. Run it locally with:
#   cd android && gradle assembleRelease -PchaquopyBuildPython=$(which python)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "bot/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 14 needs a >= 3.10 build interpreter; the app still targets 3.8
      # inside the APK because that is what the torch wheels are built for.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "7.6.4"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2" || true

      - name: Sync bot sources into the app
        run: |
          mkdir -p android/app/src/main/python android/app/src/main/assets/neuroml
          cp bot/*.py android/app/src/main/python/
          rm -f android/app/src/main/python/test_*.py android/app/src/main/python/sync_mirrors.py
          cp bot/cards.json bot/cards_v2.json bot/meta_decks.json bot/my_deck.json \
             android/app/src/main/assets/neuroml/ 2>/dev/null || true

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon -PchaquopyBuildPython="$(which python)"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/NeuroML-Android.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroML-Android-APK
          path: dist/NeuroML-Android.apk

      # Keeps the in-app updater working: it reads NeuroML-version.txt next to
      # the APK asset and offers a one-tap install when it is newer.
      - name: Publish release assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android >/dev/null 2>&1 || \
            gh release create android --title "Android builds" \
              --notes "Auto-built sideloadable APK. Install over your current build; app data is kept."
          gh release upload android dist/NeuroML-Android.apk --clobber
          python - <<'EOF'
          import re, pathlib
          g = pathlib.Path("android/app/build.gradle").read_text()
          v = re.search(r'versionName\s+"([^"]+)"', g).group(1)
          pathlib.Path("dist/NeuroML-version.txt").write_text(v)
          EOF
          gh release upload android dist/NeuroML-version.txt --clobber
